root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/client ./cmd/client"
  bin = "./tmp/client"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor"]
  delay = 1000
  log = "color"

[log]
  time = true

[color]
  main = "cyan"
  watcher = "yellow"
  build = "green"
  runner = "magenta"
